name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  python:
    name: Python — lint & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ai-model, alert-system, data-pipeline]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Lint
        run: ruff check ${{ matrix.service }}

      - name: Format check
        run: ruff format --check ${{ matrix.service }}

      - name: Install service dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        working-directory: ${{ matrix.service }}
        run: pytest -q
        continue-on-error: true   # remove once each service has real tests

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build

  schemas:
    name: Validate service contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator
        run: pip install check-jsonschema

      # A malformed contract breaks every service silently — catch it here.
      - name: Check schemas are valid JSON Schema
        run: check-jsonschema --check-metaschema shared/schemas/*.json

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ai-model, alert-system, data-pipeline]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: docker build -t vayux-${{ matrix.service }}:ci ./${{ matrix.service }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A leaked key in a public SIH repo is unrecoverable.
      - name: Fail if a .env file was committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked in git. Remove it and rotate any exposed credentials."
            exit 1
          fi
