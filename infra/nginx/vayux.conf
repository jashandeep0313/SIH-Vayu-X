# Vayu-X — reverse proxy for staging / single-VM deployment.
# One origin in front of the dashboard, API, and WebSocket.

upstream backend   { server backend:8000; }
upstream frontend  { server frontend:5173; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;   # satellite frame uploads

    # ---- API ----
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # inference can be slow on CPU
    }

    # ---- WebSocket (live dashboard updates) ----
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;  # long-lived; the dashboard must not be cut off
    }

    # ---- Dashboard ----
    location / {
        proxy_pass       http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
